# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- insert:
    - id: lan-auto-login
      name: file:///var/lib/dsh/lan-auto-login.mjs
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: locale
  config:
    preference: zh
- insert:
    - id: home-gateway-operator
      name: file:///usr/local/share/net-gateway-agent/operator.mjs

- id: credentials
  config:
    path: /var/lib/dsh-login/credentials.yaml

- insert:
    - id: dsh-web-mobile
      name: dsh-web-mobile

- insert:
    - id: home-gateway-native-maintenance
      name: file:///usr/local/share/net-gateway-agent/native-maintenance.mjs

- insert:
    - id: home-network-overview
      name: file:///usr/local/share/net-gateway-agent/network-overview/index.mjs
