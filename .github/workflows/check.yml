name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.1'
      - run: python3 -m pip install -r requirements-dev.txt
      - run: make check
      - run: npm ci --prefix runtime/dsh --ignore-scripts --no-audit --no-fund
      - run: python3 tools/apply_dsh_patches.py --runtime runtime/dsh
      - run: SDK_RUNTIME="$PWD/runtime/dsh/node_modules" node --test tests/dsh-execution/*.test.mjs
